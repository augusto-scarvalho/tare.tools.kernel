[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tare-kernel"
version = "0.9.88"
description = "Bounded model and tool execution for the tare.tools ecosystem"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    { name = "Augusto Carvalho", email = "augusto-scarvalho@users.noreply.github.com" }
]
dependencies = [
    "flatbuffers>=25.2.10,<26",
    "cryptography>=41.0.0",
    "pydantic>=2.0.0",
    "tare-tools-agent-runtime>=0.14.4,<0.15",
]

[project.optional-dependencies]
attachments = ["Pillow>=12.1.1,<13"]
dev = [
    "pytest>=8.0.0",
    "pytest-timeout>=2.2.0",
    "jsonschema>=4.18",
]
live-cache = [
    "boto3>=1.43.78",
]

[project.scripts]
tare-hook = "compute_plane.hook_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "assurance_plane*",
    "compute_plane*",
    "control_plane*",
    "data_plane*",
    "experience_plane*",
]

[tool.setuptools.package-data]
"compute_plane._vendor.von" = ["LICENSE.md", "NOTICE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
