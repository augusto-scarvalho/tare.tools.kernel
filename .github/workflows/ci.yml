name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The agent runtime and SpecGraph revisions the integration tests run against (README: Install and test).
  RUNTIME_REVISION: 133d9bba5c584c1959595a50e86430670bf666f2
  SPECGRAPH_REVISION: cce9edde05950bfcce980a1634f974d48308437c

jobs:
  test:
    name: Tests (${{ matrix.platform }})
    # GitHub-hosted runners by default. The repository variables CI_RUNNER_LINUX and CI_RUNNER_WINDOWS (a JSON
    # label or label list, e.g. ["self-hosted","Linux"]) move a platform to your own runners; pull requests from
    # forks then skip this job, since they could run any code there.
    if: >-
      github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      || (!vars.CI_RUNNER_LINUX && !vars.CI_RUNNER_WINDOWS)
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ${{ vars.CI_RUNNER_LINUX || '"ubuntu-latest"' }}
          - platform: windows
            runner: ${{ vars.CI_RUNNER_WINDOWS || '"windows-latest"' }}
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the kernel with the pinned runtime and SpecGraph
        run: >-
          python -m pip install
          "git+https://github.com/augusto-scarvalho/tare.tools.agent-runtime@${{ env.RUNTIME_REVISION }}"
          "git+https://github.com/augusto-scarvalho/tare.tools.specgraph@${{ env.SPECGRAPH_REVISION }}"
          -e ".[dev,attachments,live-cache]"

      - name: Require every plane and the SpecGraph integration (no optional skips)
        run: >-
          python -c "import assurance_plane, compute_plane, control_plane, data_plane, experience_plane;
          import specgraph.hook_context, specgraph.lifecycle; print('Kernel and pinned SpecGraph loaded')"

      - name: Install pinned ripgrep for the search tests
        run: python tools/install_test_ripgrep.py

      - name: Run the test suite
        run: python -m pytest tests/ -q --junitxml=kernel-${{ matrix.platform }}.xml

      - name: Upload test receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-tests-${{ matrix.platform }}
          path: kernel-${{ matrix.platform }}.xml
          if-no-files-found: warn

  linux-sandbox:
    name: Linux sandbox (bubblewrap)
    # Always a GitHub-hosted runner, never CI_RUNNER_LINUX: it lowers a kernel setting with sudo, which only a
    # throwaway machine may take. It proves compute_plane/linux_bwrap.py on stock Ubuntu.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the kernel with the pinned runtime and SpecGraph
        run: >-
          python -m pip install
          "git+https://github.com/augusto-scarvalho/tare.tools.agent-runtime@${{ env.RUNTIME_REVISION }}"
          "git+https://github.com/augusto-scarvalho/tare.tools.specgraph@${{ env.SPECGRAPH_REVISION }}"
          -e ".[dev,attachments,live-cache]"

      - name: Install bubblewrap from the distribution
        run: sudo apt-get update -q && sudo apt-get install -y -q bubblewrap

      - name: Record the stock host (never fails)
        run: |
          . /etc/os-release && echo "distribution: $PRETTY_NAME, kernel $(uname -r)"
          bwrap --version
          echo "kernel.apparmor_restrict_unprivileged_userns: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo absent)"
          grep -H . /proc/sys/kernel/apparmor_restrict_unprivileged* /proc/sys/kernel/unprivileged_userns_clone /proc/sys/user/max_user_namespaces 2>/dev/null || true
          if bwrap --unshare-user --unshare-net --ro-bind / / true; then echo "plain bwrap --unshare-user: works"; else echo "plain bwrap --unshare-user: refused (exit $?)"; fi
          python -c "
          from compute_plane.linux_bwrap import require_support
          try:
              require_support()
              print('require_support: the sandbox is available')
          except OSError as error:
              print('require_support:', error)"

      - name: On a stock host that refuses user namespaces, the support check says so
        id: stock
        run: python -m pytest tests/test_linux_bwrap.py -q -rs -k stock_host

      # The steps below still run when only the stock check failed, so one run shows both results.
      - name: Lower the AppArmor restriction on this throwaway runner
        if: success() || steps.stock.outcome == 'failure'
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-user --unshare-net --ro-bind / / true && echo "plain bwrap --unshare-user: works"

      - name: Run the real-sandbox tests (a skip fails)
        if: success() || steps.stock.outcome == 'failure'
        env:
          TARE_REQUIRE_SANDBOX: '1'
        run: python -m pytest tests/test_linux_bwrap.py -v -rs -k "not stock_host" --junitxml=kernel-linux-sandbox.xml

      - name: Upload test receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-tests-linux-sandbox
          path: kernel-linux-sandbox.xml
          if-no-files-found: warn
